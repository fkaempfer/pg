# This file is a template, and might need editing before it works on your project.
# Official docker image.

image:
  name: quay.io/podman/stable
  entrypoint: [""]
cache:
  key: one-key-to-rule-them-all

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: ${HARBOR_HOST}/${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_NAME}
build:
  stage: build
  before_script:
    - podman info
    - podman login --username "${HARBOR_USER}" --password "${HARBOR_PW}" "${HARBOR_HOST}"

  script:
    - podman build -t ${IMAGE_NAME}:${CI_COMMIT_SHA} .
    - podman tag ${IMAGE_NAME}:${CI_COMMIT_SHA} ${IMAGE_NAME}:latest
    - podman push ${IMAGE_NAME}:${CI_COMMIT_SHA}
    - podman push ${IMAGE_NAME}:latest
  after_script:
    - podman logout "${HARBOR_HOST}"
